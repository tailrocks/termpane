# Source of truth for the tested Rust channel and required components.
# Read by rustup, rust-analyzer, and CI.
# `rust-version` in Cargo.toml matches this channel; older compilers are unsupported.

[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
