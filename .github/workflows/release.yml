name: release

# Tag push reruns the gates and drafts the GitHub Release. It NEVER publishes
# to crates.io — publishing is manual-only via publish.yml (workflow_dispatch).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-nextest, cargo-deny)
        with:
          tool: cargo-nextest,cargo-deny
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: nextest
        run: cargo nextest run --all-features --locked --profile ci
      - name: doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: cargo deny check
        run: cargo deny check
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: publish dry run
        run: cargo publish --dry-run --locked

  github-release:
    name: GitHub Release
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "${TAG}" || {
            echo "tag ${TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
      - name: extract changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "no CHANGELOG.md section for ${version}" >&2
            exit 1
          }
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md
