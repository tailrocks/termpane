      VELNOR_RELEASE_COMMIT: 82ad7e9f788718855469444a3a02ea79ba0fe087
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    needs:
      - plan
    if: "!contains(needs.plan.outputs.not_affected_jobs, ',rust-termpane-fuzz,')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Setup Mise
