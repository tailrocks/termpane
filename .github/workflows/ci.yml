name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins 1.97.1 (the MSRV pin); rustup auto-installs it.
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-nextest)
        with:
          tool: cargo-nextest
      - name: nextest (default features)
        run: cargo nextest run --locked --profile ci
      - name: nextest (all features)
        run: cargo nextest run --all-features --locked --profile ci

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  supply-chain:
    name: deny + reuse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-deny)
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  feature-powerset:
    name: cargo hack feature-powerset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-hack)
        with:
          tool: cargo-hack
      - name: cargo hack
        run: cargo hack check --feature-powerset --all-targets --locked

  benches:
    name: build benches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo build --benches
        run: cargo build --benches --locked

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: publish dry run
        run: cargo publish --dry-run --locked

  fuzz-smoke:
    name: fuzz smoke (30s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-fuzz)
        with:
          tool: cargo-fuzz
      - name: install fuzz target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: bounded fuzz run
        run: cargo fuzz run --sanitizer none --target x86_64-unknown-linux-gnu damage_grid_process -- -max_total_time=30

  msrv:
    name: MSRV 1.97.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install MSRV toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: cargo check at MSRV floor
        run: cargo +1.97.0 check --locked
