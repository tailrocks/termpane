      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    needs:
      - plan
    if: "!contains(needs.plan.outputs.not_affected_jobs, ',rust-termpane-fuzz-full,')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
