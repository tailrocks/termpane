      - id: verify-rust-root-sources_key
        name: Verify the rust-root sources cache upload
        if: '${{ needs.rust-root.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-root.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-fuzz-target_key
        name: Verify the rust-fuzz target cache upload
        if: '${{ needs.rust-fuzz.outputs.target_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-fuzz.outputs.target_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - id: verify-rust-fuzz-sources_key
        name: Verify the rust-fuzz sources cache upload
        if: '${{ needs.rust-fuzz.outputs.sources_key != '''' }}'
        continue-on-error: true
        env:
          CACHE_KEY: '${{ needs.rust-fuzz.outputs.sources_key }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache verify --key "$CACHE_KEY"'
      # jactionlint ignore=shellcheck
      - name: Require verified cache uploads
        env:
          CACHE_OK: '${{ steps.verify-rust-root-target_key.outcome != ''failure'' && steps.verify-rust-root-sources_key.outcome != ''failure'' && steps.verify-rust-fuzz-target_key.outcome != ''failure'' && steps.verify-rust-fuzz-sources_key.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - name: Enforce the repository cache budget
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache budget --budget-bytes 8000000000'
      # jactionlint ignore=shellcheck
      - name: Delete the private-base caches unless the repository is private
        if: '${{ !cancelled() }}'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: '. "$VELNOR_EXEC" cache purge-private --if-public'
  required:
    name: Required
    needs:
      - rust-plan
      - rust-root
      - rust-fuzz
      - policy
      - lint-jactionlint
      - lint-generated-check
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always()) }}'
    permissions:
      contents: read
    cache-mode: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.116
        uses: tailrocks/velnor-new/actions/setup-velnor@5e3c38d6eca734106e0f2b0e677f9191be26c012  # tools-v0.1.116
        with:
          version: '0.1.116'
          sha256-linux-x64: '6386bc7033f7f6a73a4b37a92551c102194e4fc103cf615c589dcb77564cbb74'
          sha256-linux-arm64: '2054b1b577cd300df2d0505759167037bf66c46b5c5598c722851e4a34765c1a'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-root=lane:root --job rust-fuzz=lane:fuzz --job policy=policy --job lint-jactionlint=always --job lint-generated-check=always --tests rust-root=root'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  cache:
    name: Cache
    needs:
      - rust-root
      - rust-fuzz
      - policy
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && (needs.rust-root.result != ''skipped'' || needs.rust-fuzz.result != ''skipped'' || needs.policy.result != ''skipped'' || needs.rust-trim.result != ''skipped'')) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.116
        uses: tailrocks/velnor-new/actions/setup-velnor@5e3c38d6eca734106e0f2b0e677f9191be26c012  # tools-v0.1.116
        with:
          version: '0.1.116'
          sha256-linux-x64: '6386bc7033f7f6a73a4b37a92551c102194e4fc103cf615c589dcb77564cbb74'
          sha256-linux-arm64: '2054b1b577cd300df2d0505759167037bf66c46b5c5598c722851e4a34765c1a'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Download cache metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: 'ci-metrics-*'
          path: '${{ runner.temp }}/ci-metrics'
      # jactionlint ignore=shellcheck
      - name: Check cache waste
        env:
          VELNOR_REPORT_NEEDS: '${{ toJSON(needs) }}'
          GITHUB_TOKEN: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '''' }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report --check "$RUNNER_TEMP/ci-metrics"'
