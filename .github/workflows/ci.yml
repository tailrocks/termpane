    name: Rust / termpane-fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CACHE_EXPORT_GROUP: velnor
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
