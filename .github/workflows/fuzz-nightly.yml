name: fuzz-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-long:
    name: fuzz damage_grid_process (300s, no sanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-fuzz)
        with:
          tool: cargo-fuzz
      - name: install fuzz target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: fuzz (no sanitizer)
        run: cargo fuzz run --sanitizer none --target x86_64-unknown-linux-gnu damage_grid_process -- -max_total_time=300

  fuzz-asan:
    name: fuzz damage_grid_process (300s, ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # main (cargo-fuzz)
        with:
          tool: cargo-fuzz
      - name: install nightly + fuzz target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup +nightly target add x86_64-unknown-linux-gnu
      - name: fuzz (AddressSanitizer)
        run: cargo +nightly fuzz run --sanitizer address --target x86_64-unknown-linux-gnu damage_grid_process -- -max_total_time=300
