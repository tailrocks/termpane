name: publish

# Manual-only crates.io publish. Never triggered by tags or merges.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the crate name (termpane) to confirm a real crates.io publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - name: confirm crate name
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${CONFIRM}" = "termpane" || {
            echo "confirmation input must be exactly 'termpane'" >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gates
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo publish --dry-run --locked
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
