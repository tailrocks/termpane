# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@e6fabca85499be62f939243d4452438449b69c53
        with:
          rev: e6fabca85499be62f939243d4452438449b69c53
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=e6fabca85499be62f939243d4452438449b69c53" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_LANES: ${{ github.event.inputs.runner || 'both' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: e6fabca85499be62f939243d4452438449b69c53
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-e6fabca85499be62f939243d4452438449b69c53-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  velnor-lane-admission:
    name: "Control / Velnor admission"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Velnor lane omitted for fork
        run: |
          echo '::notice::Velnor lane omitted for fork pull request; validating GitHub lane only.'
  prepare-cargo:
    name: "Control / Prepare Cargo"
    if: ${{ always() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-policy,') }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-policy
      lane: control
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  github-rust-policy:
    name: "Rust · Rust dependency policy"
    if: ${{ always() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-policy,') }}
    needs: [plan]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-policy
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  velnor-rust-policy:
    name: "Rust · Rust dependency policy"
    if: ${{ always() && needs.plan.result == 'success' && (needs.prepare-cargo.result == 'success' || needs.prepare-cargo.result == 'skipped') && contains(format(',{0},', needs.plan.outputs.units), ',rust-policy,') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [plan, prepare-cargo]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-policy
      lane: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  github-rust-termpane:
    name: "Rust · termpane"
    if: ${{ always() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-termpane,') }}
    needs: [plan]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-termpane
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  velnor-rust-termpane:
    name: "Rust · termpane"
    if: ${{ always() && needs.plan.result == 'success' && (needs.prepare-cargo.result == 'success' || needs.prepare-cargo.result == 'skipped') && contains(format(',{0},', needs.plan.outputs.units), ',rust-termpane,') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [plan, prepare-cargo]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-termpane
      lane: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  github-rust-termpane-fuzz:
    name: "Rust · termpane-fuzz"
    if: ${{ always() && needs.plan.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-termpane-fuzz,') }}
    needs: [plan]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-termpane-fuzz
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  velnor-rust-termpane-fuzz:
    name: "Rust · termpane-fuzz"
    if: ${{ always() && needs.plan.result == 'success' && (needs.prepare-cargo.result == 'success' || needs.prepare-cargo.result == 'skipped') && contains(format(',{0},', needs.plan.outputs.units), ',rust-termpane-fuzz,') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [plan, prepare-cargo]
    cache-mode: read
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-termpane-fuzz
      lane: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, velnor-lane-admission, prepare-cargo, github-rust-policy, velnor-rust-policy, github-rust-termpane, velnor-rust-termpane, github-rust-termpane-fuzz, velnor-rust-termpane-fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job velnor-lane-admission)"
          case "$result" in
            success|skipped) ;;
            *) echo "required CI prerequisite velnor-lane-admission did not pass: $result" >&2; exit 1 ;;
          esac
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job prepare-cargo)"
            if [[ "$result" != success ]]; then
              echo "selected CI prerequisite prepare-cargo did not pass: $result" >&2
              exit 1
            fi
          else
            result="$(result_for_job prepare-cargo)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI prerequisite prepare-cargo failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job github-rust-policy)"
            if [[ "$FORK_PR" == true && false ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job github-rust-policy did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job github-rust-policy did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-rust-policy)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-policy failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job velnor-rust-policy)"
            if [[ "$FORK_PR" == true && true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-rust-policy did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job velnor-rust-policy did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-rust-policy)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job velnor-rust-policy failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-termpane,"* ]]; then
            result="$(result_for_job github-rust-termpane)"
            if [[ "$FORK_PR" == true && false ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job github-rust-termpane did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job github-rust-termpane did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-rust-termpane)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-termpane failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-termpane,"* ]]; then
            result="$(result_for_job velnor-rust-termpane)"
            if [[ "$FORK_PR" == true && true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-rust-termpane did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job velnor-rust-termpane did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-rust-termpane)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job velnor-rust-termpane failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-termpane-fuzz,"* ]]; then
            result="$(result_for_job github-rust-termpane-fuzz)"
            if [[ "$FORK_PR" == true && false ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job github-rust-termpane-fuzz did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job github-rust-termpane-fuzz did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-rust-termpane-fuzz)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-termpane-fuzz failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-termpane-fuzz,"* ]]; then
            result="$(result_for_job velnor-rust-termpane-fuzz)"
            if [[ "$FORK_PR" == true && true ]]; then
              case "$result" in
                success|skipped) ;;
                *) echo "selected CI job velnor-rust-termpane-fuzz did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                success) ;;
                *) echo "selected CI job velnor-rust-termpane-fuzz did not pass: $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-rust-termpane-fuzz)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job velnor-rust-termpane-fuzz failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: "Control / Required"
    if: ${{ always() }}
    needs: [ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}
        run: exit 1
